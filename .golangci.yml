version: "2"
run:
  timeout: 5m
linters:
  enable:
    - goconst
    - gocyclo
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      # Fixture strings and protocol field names do not benefit from constants.
      ignore-tests: true
      ignore-map-keys: true
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
